server {
    listen 80;
    server_name https://hitonichi.onrender.com; # ドメイン名またはIPアドレス

    root /var/www/backend/public; # Laravelプロジェクトのpublicディレクトリ
    index index.php;

    # LaravelのAPIエンドポイントを処理
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # PHP-FPMソケットパス (バージョンは環境に合わせて)
        # fastcgi_pass 127.0.0.1:9000; # TCPソケットの場合
        fastcgi_index index.php;
    }

    # 公開ディレクトリ内の静的ファイル（CSS, JS, 画像など）のキャッシュ設定例
    location ~* \.(css|js|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # .envファイルなどへの直接アクセスを禁止
    location ~ /\.env {
        deny all;
    }
}
