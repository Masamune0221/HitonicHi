events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # CORS Origin validation
    map $http_origin $cors_origin {
        default "";
        "https://hitonichi-97c4a.web.app" $http_origin;
        "https://hitonichi-97c4a.firebaseapp.com" $http_origin;
    }

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        client_max_body_size 20M;

        location / {
            # CORS Headers
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Authorization, X-XSRF-TOKEN, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Authorization, X-XSRF-TOKEN, Accept' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM
        location ~ \.php$ {
            # CORS Headers for PHP responses
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Authorization, X-XSRF-TOKEN, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Deny sensitive files
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
