events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    server {
        listen 8080;
        server_name _;
        
        root /var/www/html/public;
        index index.php index.html;
        client_max_body_size 20M;
        location / {
            set $cors_origin "";
            if ($http_origin ~* ^https?://hitonichi-97c4a\.(web\.app|firebaseapp\.com)$ ) {
                set $cors_origin $http_origin;
            }
            add_header 'Access-Control-Allow-Origin' 'https://hitonichi-97c4a.web.app' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
            add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Authorization, X-XSRF-TOKEN' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # プリフライト（OPTIONSリクエスト）への即答
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://hitonichi-97c4a.web.app' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
                add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Authorization, X-XSRF-TOKEN' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                return 204;
            }
            try_files $uri $uri/ /index.php?$query_string;
        }
        # /up や API リクエストを確実に PHP に流す
        location ~ \.php$ {
            # ファイルが存在するか再確認
            try_files $uri =404;
            
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            
            include fastcgi_params;
            # 確実なフルパス指定
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
