services:
  db:
    container_name: HitonicHi_mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: Hitonichi
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: Hitonichi_user
      MYSQL_PASSWORD: Hitonichi_pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
volumes:
  db_data:
